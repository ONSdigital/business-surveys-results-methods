[project]
name = "business-surveys-results-methods"
dynamic = ["version"]
description = "Methods for results processing of ONS business surveys"
authors = [
    {name = "Reproducible Data Science and Analysis, ONS", email = "RDSA.Support@ons.gov.uk"},
]
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "rdsa-utils~=0.16.1",
    "black>=26.5.0",
]

[dependency-groups]
dev = [
    "pre-commit~=2.17.0",
    "pytest-cov~=4.0.0",
    "pytest-lazy-fixture~=0.6.0",
    "pytest-mock~=3.8.0",
    "ruff~=0.13.3",
]


[tool.setuptools]
packages = ["bsrm"]

[tool.coverage.run]
branch = true
source = ["bsrm"]
dynamic_context = 'test_function'

[tool.coverage.report]
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "__version__ = ",
]
# List any filepaths here (relative to source defined above) to exclude from
# the final coverage test report.
omit = [
   "bsrm/main.py",
]
skip_empty = true
show_missing = true

[tool.coverage.html]
show_contexts = true

[tool.ruff]
lint.select = [
   "A",    # https://beta.ruff.rs/docs/rules/#flake8-builtins-a
   "ANN",  # https://beta.ruff.rs/docs/rules/#flake8-annotations-ann
   "B",    # https://beta.ruff.rs/docs/rules/#flake8-bugbear-b
   "C4",   # https://beta.ruff.rs/docs/rules/#flake8-comprehensions-c4
   "D",    # https://beta.ruff.rs/docs/rules/#pydocstyle-d
   "DTZ",  # https://beta.ruff.rs/docs/rules/#flake8-datetimez-dtz
   "E",    # https://beta.ruff.rs/docs/rules/#error-e
   "EM",   # https://beta.ruff.rs/docs/rules/#flake8-errmsg-em
   "F",    # https://beta.ruff.rs/docs/rules/#pyflakes-f
   "ISC",  # https://beta.ruff.rs/docs/rules/#flake8-implicit-str-concat-isc
   "N",    # https://beta.ruff.rs/docs/rules/#pep8-naming-n
   "NPY",  # https://beta.ruff.rs/docs/rules/#numpy-specific-rules-npy
   "PD",   # https://beta.ruff.rs/docs/rules/#pandas-vet-pd
   "PT",   # https://beta.ruff.rs/docs/rules/#flake8-pytest-style-pt
   "PTH",  # https://beta.ruff.rs/docs/rules/#flake8-use-pathlib-pth
   "Q",    # https://beta.ruff.rs/docs/rules/#flake8-quotes-q
   "T10",  # https://beta.ruff.rs/docs/rules/#flake8-debugger-t10
   "T20",  # https://beta.ruff.rs/docs/rules/#flake8-print-t20
   "W",    # https://beta.ruff.rs/docs/rules/#warning-w
   "YTT",  # https://beta.ruff.rs/docs/rules/#flake8-2020-ytt
]

# Ignore these ruff rules everywhere.
lint.ignore = [
   # PD901: pandas-df-variable-name
   # This complains about anything called df.
   "PD901",
]
line-length = 100
exclude = ["dev_utils/*","*tests/*"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double" #! CHECK everyone is happy with this

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = [
   "D104", # Allows missing docstring in public package
   "F401", # Allows unused imports
]
"tests/*" = [
   "ANN",
   "D100", # Allows missing docstring in public module
   "E501", # Ignores line length limit, useful for test data
   "F403", "F405", # Allows importing with *, useful for test scripts
]
"*/validation/*" = [
   "T201", "T203", # Allows print and pprint, useful for validation
]
