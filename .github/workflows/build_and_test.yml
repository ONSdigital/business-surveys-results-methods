name: Build and test
on: [push, workflow_dispatch]

env:
  PROJECT_NAME: bsrm
  ARTIFACTORY_PYPI_REPO: LR_EPDS_pypi
permissions:
  contents: read
  

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        # remember to update this if we have a later version of uv
        enable-cache: true

    - name: Set up Python 3.11.0
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.11.0"

    # Re-lock since Github Actions can't access Artifactory
    - name: Setup and install dependencies
      run: |
        uv lock --default-index https://pypi.org/simple
        uv sync

    - name: Run unit tests and coverage report
      run: |
        source .venv/bin/activate
        pytest tests/ --cov --cov-report term --verbose

  
