# Precommit hooks.
# install using `pre-commit install`
# skip using `git commit -m "message" --no-verify`
default_stages: [commit, push]

repos:
  # Default provided pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    - id: check-added-large-files
      exclude_types: [markdown, yaml, json]
    - id: check-merge-conflict
    - id: check-yaml
    - id: detect-private-key # detects the presence of private keys
    - id: end-of-file-fixer
    - id: fix-byte-order-marker
    - id: name-tests-test
      args: [--pytest-test-first]
    - id: trailing-whitespace
      exclude: |
          (?x)(
            ^dev_utils/ |
            ^config/ |
            ^.github/
          )

  # Yelp pre-commit hooks to detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)(
            ^docs/environment_setup.md
          )

  # Ruff pre-commit hook
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.13.3
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [ python, pyi ]
      # Run the formatter.
      - id: ruff-format
        types_or: [ python, pyi ]

  # Bandit pre-commit hook to detect vulnerabilities
  - repo: https://github.com/Lucas-C/pre-commit-hooks-bandit
    rev: v1.0.5
    hooks:
    -   id: python-bandit-vulnerability-check
        args: [--skip, "B101", --recursive, clumper]

  # Local hooks
  - repo: local
    hooks:

      - id: restricted-filenames
        name: Check commits for restricted file extensions
        entry: Looking for extensions that are not allowed
        language: fail
        files: .*\.(csv|feather|xlsx|zip|hdf5|h5|txt|xml|hd|parquet)

      - id: prepare_commit_msg
        name: Prepare commit message
        entry: dev_utils/pre-commit_helpers/prepare_commit_msg.py
        stages: [prepare-commit-msg]
        language: system
        exclude: |
          (?x)(
            ^dev_utils/ |
            ^config/ |
            ^.gitlab/
          )
        exclude_types: [markdown, yaml]
